name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit and integration tests
        run: npm test

      - name: Synthetic benchmark
        run: npm run benchmark

      - name: Syntax and module checks
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Exercise composite GitHub Action
        uses: ./
        with:
          path: ./examples/safe-skill
          fail-on: none

      - name: Scan safe example skill
        run: node src/cli.js examples/safe-skill --format json --fail-on none
