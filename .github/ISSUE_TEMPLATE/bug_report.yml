name: Bug report
description: Report a reproducible bug, false positive, or unexpected behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SkillGuard.
        **Do not paste real API keys, tokens, private keys, or private skill content.**
        Sanitize examples before submitting.
  - type: input
    id: version
    attributes:
      label: SkillGuard version
      description: Output of `skillguard --version` or the package version you installed.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11 / Termux"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command run
      description: Include flags and paths (sanitized).
      placeholder: skillguard ./example-skill --format json --fail-on high
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal sanitized steps or fixture that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant output snippets (sanitized).
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I have sanitized any secrets or private content
          required: true
