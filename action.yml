name: 'SkillGuard Security Scan'
description: 'Offline static security audit of AI agent skill bundles. Detects prompt injection, secrets, reverse shells, destructive commands and supply-chain risk patterns without executing scanned content.'
author: 'Khayom Abdurahmonov'

inputs:
  path:
    description: 'Path to a skill directory or file to audit.'
    required: false
    default: '.'
  fail-on:
    description: 'Minimum severity that fails the workflow (critical, high, medium, low, none).'
    required: false
    default: 'high'
  upload-sarif:
    description: 'Upload generated SARIF report to GitHub Code Scanning (requires security-events: write).'
    required: false
    default: 'false'
  sarif-file:
    description: 'Path for the generated SARIF report.'
    required: false
    default: 'skillguard.sarif'

runs:
  using: composite
  steps:
    - name: Run SkillGuard
      id: scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SKILLGUARD_PATH: ${{ inputs.path }}
        SKILLGUARD_FAIL_ON: ${{ inputs.fail-on }}
        SKILLGUARD_SARIF: ${{ inputs.sarif-file }}
      run: |
        node "$GITHUB_ACTION_PATH/src/cli.js" "$SKILLGUARD_PATH" --format sarif --output "$SKILLGUARD_SARIF" --fail-on "$SKILLGUARD_FAIL_ON"
    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-file) != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}

branding:
  icon: shield
  color: blue
